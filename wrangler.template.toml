# Template — the real wrangler.toml is generated by `pnpm materialize` from build
# variables and is gitignored (ADR-004). Set these before deploy:
#   CLOUDFLARE_ACCOUNT_ID, FK_D1_ID, FK_R2_BUCKET
# (as Workers Builds build variables, or in your shell for a local deploy).
# Optional: FK_CUSTOM_DOMAIN (bare hostname) adds a custom-domain route.
# Optional: FK_OAUTH_KV_ID (KV namespace id) binds OAUTH_KV and turns on the MCP
# server at /mcp (ADR-015); without it /mcp answers 404.
name = "feedbackkit"
main = "src/worker/index.ts"
compatibility_date = "2025-01-01"
# global_fetch_strictly_public: outbound fetch always goes over the public
# internet, never straight to an origin in this zone. The MCP OAuth server needs
# it to fetch Client ID Metadata Documents safely (ADR-015).
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
account_id = "${CLOUDFLARE_ACCOUNT_ID}"
${FK_ROUTES}
# Release channels (ADR-013, docs/RELEASES.md): production serves stable; the
# "dev" preview alias (dev-<name>.<subdomain>.workers.dev) serves the dev build.
workers_dev = true
preview_urls = true

# Widget bundle + admin assets are served from ./dist by the Worker.
[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "feedbackkit"
database_id = "${FK_D1_ID}"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "${FK_R2_BUCKET}"

${FK_OAUTH_KV}

[triggers]
# App-level R2 retention sweep + events rollup (P1.8 / P1.9).
crons = ["0 3 * * *"]

[vars]
FK_ENV = "production"
FK_RELEASE = "${FK_RELEASE}"
FK_CHANNEL = "${FK_CHANNEL}"
WIDGET_VERSION = "${WIDGET_VERSION}"
