name: Promote to stable

# A tested dev build becomes vX.Y.Z (ADR-013, docs/RELEASES.md): the same commit,
# rebuilt with the stable version, deployed to production, released as latest,
# and the `stable` branch fast-forwarded to it for self-hosters.
on:
  workflow_dispatch:
    inputs:
      dev_tag:
        description: "Tested dev build, e.g. v0.1.0-dev.3"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stable:
    if: github.repository == 'TruffleCraft/feedbackkit'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      FK_D1_ID: ${{ vars.FK_D1_ID }}
      FK_R2_BUCKET: ${{ vars.FK_R2_BUCKET }}
      FK_CUSTOM_DOMAIN: ${{ vars.FK_CUSTOM_DOMAIN }}
      FK_OAUTH_KV_ID: ${{ vars.FK_OAUTH_KV_ID }} # optional: binds OAUTH_KV, turns on /mcp (ADR-015)
      DEV_TAG: ${{ inputs.dev_tag }}
      GH_TOKEN: ${{ github.token }}
      FK_RELEASE_SIGNING_KEY: ${{ secrets.FK_RELEASE_SIGNING_KEY }} # the stable key (docs/RELEASES.md, Release keys)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Kept: "Move the stable branch" pushes with the stored credentials.
          persist-credentials: true

      # Validates the input (format, exists, not yet released, newer than stable)
      # before it is used anywhere else.
      - name: Version
        id: v
        run: |
          tag="$(node scripts/release-version.mjs promote "$DEV_TAG")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "previous=$(node scripts/release-version.mjs latest-stable)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-list -n 1 "refs/tags/$DEV_TAG")" >> "$GITHUB_OUTPUT"

      - name: Check out the dev build's commit
        env:
          SHA: ${{ steps.v.outputs.sha }}
        run: git checkout --detach "$SHA"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test

      - name: Build
        run: pnpm build:widget && pnpm materialize
        env:
          FK_RELEASE: ${{ steps.v.outputs.version }}
          FK_CHANNEL: stable

      # Before anything is deployed: the server tarball of this commit is built and signed, and
      # it must equal the dev tarball that was tested (ADR-013), or the promotion stops here.
      - name: Build, check and sign the server tarball
        if: env.FK_RELEASE_SIGNING_KEY != ''
        env:
          FK_RELEASE: ${{ steps.v.outputs.version }}
        run: |
          pnpm build:server
          node scripts/build-bundle.mjs
          if gh release download "$DEV_TAG" --pattern 'feedbackkit-v*.tar.gz' --dir dist-dev 2>/dev/null; then
            node scripts/compare-bundles.mjs dist-dev/feedbackkit-v*.tar.gz dist-bundle/feedbackkit-v*.tar.gz
          else
            echo "::warning::$DEV_TAG has no server tarball, so the stable tarball was not compared with a tested build."
          fi
          sh scripts/sign-release.sh dist-bundle/SHA256SUMS
      - name: No signing key
        if: env.FK_RELEASE_SIGNING_KEY == ''
        run: echo "::warning::FK_RELEASE_SIGNING_KEY is not set in the production environment, so no server tarball is published (docs/RELEASES.md, Release keys)."

      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply feedbackkit --remote

      - name: Deploy to production
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: pnpm exec wrangler deploy --message "stable ${TAG} (${DEV_TAG})"

      - name: Smoke check
        if: vars.FK_GATEWAY_URL != ''
        env:
          GATEWAY_URL: ${{ vars.FK_GATEWAY_URL }}
          VERSION: ${{ steps.v.outputs.version }}
        run: node scripts/smoke-check.mjs "$GATEWAY_URL" "$VERSION" stable

      # Config writers accept new delivery shapes only once stable handles them (#109).
      - name: Record delivery capability
        run: |
          level="$(node scripts/delivery-capability.mjs)"
          pnpm exec wrangler d1 execute feedbackkit --remote --command \
            "INSERT INTO meta (key, value) VALUES ('delivery_capability', '${level}') ON CONFLICT(key) DO UPDATE SET value = excluded.value"

      - name: Release
        env:
          TAG: ${{ steps.v.outputs.tag }}
          SHA: ${{ steps.v.outputs.sha }}
          PREVIOUS: ${{ steps.v.outputs.previous }}
        run: |
          gh release create "$TAG" dist/widget.js --latest --target "$SHA" --title "$TAG" --generate-notes ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}

      - name: Attach the server tarball
        if: env.FK_RELEASE_SIGNING_KEY != ''
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: gh release upload "$TAG" dist-bundle/feedbackkit-v*.tar.gz dist-bundle/SHA256SUMS dist-bundle/SHA256SUMS.sig

      # Fast-forward only: promoting an older commit than the current stable fails here.
      - name: Move the stable branch
        env:
          SHA: ${{ steps.v.outputs.sha }}
        run: git push origin "${SHA}:refs/heads/stable"

      - name: Remove this version's dev builds
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          node scripts/release-version.mjs dev-of "$TAG" | while read -r old; do
            gh release delete "$old" --yes --cleanup-tag || true
          done
