name: Release (dev channel)

# Every merge to main becomes a dev build (ADR-013, docs/RELEASES.md): version
# vX.Y.Z-dev.N from the tags, a GitHub prerelease with widget.js and the signed
# server tarball. Nothing is deployed: hosts take the build with feedbackkit-update.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Start a new line instead of the next patch"
        type: choice
        options: [none, minor, major]
        default: none

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dev:
    # Upstream only: forks publish no releases.
    if: github.repository == 'TruffleCraft/feedbackkit'
    runs-on: ubuntu-latest
    environment: dev
    env:
      BUMP: ${{ inputs.bump || 'none' }}
      GH_TOKEN: ${{ github.token }}
      FK_RELEASE_SIGNING_KEY: ${{ secrets.FK_RELEASE_SIGNING_KEY }} # the dev key (docs/RELEASES.md, Release keys)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the version is derived from the tags
          # Kept: "Keep the newest 3 dev builds" falls back to git push --delete with the stored credentials.
          persist-credentials: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test

      - name: Version
        id: v
        run: |
          tag="$(node scripts/release-version.mjs next-dev "$BUMP")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm build:widget
        env:
          FK_RELEASE: ${{ steps.v.outputs.version }}
          FK_CHANNEL: dev

      - name: Prerelease
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: gh release create "$TAG" dist/widget.js --prerelease --target "$GITHUB_SHA" --title "$TAG" --generate-notes

      # The standalone server as a signed tarball. Without a signing key nothing is
      # published: an unsigned tarball is never attached to a release. Before it is
      # attached, the unpacked tarball starts with Node alone and must answer /diag
      # with this version and channel (scripts/smoke-bundle.mjs).
      - name: Build, sign and attach the server tarball
        if: env.FK_RELEASE_SIGNING_KEY != ''
        env:
          TAG: ${{ steps.v.outputs.tag }}
          FK_RELEASE: ${{ steps.v.outputs.version }}
        run: |
          pnpm build:server
          node scripts/build-bundle.mjs
          node scripts/smoke-bundle.mjs dist-bundle/feedbackkit-v*.tar.gz "$FK_RELEASE" dev
          sh scripts/sign-release.sh dist-bundle/SHA256SUMS
          gh release upload "$TAG" dist-bundle/feedbackkit-v*.tar.gz dist-bundle/SHA256SUMS dist-bundle/SHA256SUMS.sig
      - name: No signing key
        if: env.FK_RELEASE_SIGNING_KEY == ''
        run: echo "::warning::FK_RELEASE_SIGNING_KEY is not set in the dev environment, so no server tarball was published (docs/RELEASES.md, Release keys)."

      - name: Keep the newest 3 dev builds
        run: |
          node scripts/release-version.mjs prune-dev 3 | while read -r old; do
            gh release delete "$old" --yes --cleanup-tag || git push origin --delete "refs/tags/$old" || true
          done
