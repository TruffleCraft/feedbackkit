name: Release (dev channel)

# Every merge to main becomes a dev build (ADR-013, docs/RELEASES.md):
# version vX.Y.Z-dev.N from the tags, uploaded as a new Worker version behind the
# "dev" preview alias (production stays on stable), plus a GitHub prerelease.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Start a new line instead of the next patch"
        type: choice
        options: [none, minor, major]
        default: none

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dev:
    # Upstream only: forks deploy their own instance with Workers Builds.
    if: github.repository == 'TruffleCraft/feedbackkit'
    runs-on: ubuntu-latest
    environment: dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      FK_D1_ID: ${{ vars.FK_D1_ID }}
      FK_R2_BUCKET: ${{ vars.FK_R2_BUCKET }}
      FK_OAUTH_KV_ID: ${{ vars.FK_OAUTH_KV_ID }} # optional: binds OAUTH_KV, turns on /mcp (ADR-015)
      BUMP: ${{ inputs.bump || 'none' }}
      GH_TOKEN: ${{ github.token }}
      FK_RELEASE_SIGNING_KEY: ${{ secrets.FK_RELEASE_SIGNING_KEY }} # the dev key (docs/RELEASES.md, Release keys)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version is derived from the tags
          # Kept: "Keep the newest 3 dev builds" falls back to git push --delete with the stored credentials.
          persist-credentials: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test

      - name: Version
        id: v
        run: |
          tag="$(node scripts/release-version.mjs next-dev "$BUMP")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm build:widget && pnpm materialize
        env:
          FK_RELEASE: ${{ steps.v.outputs.version }}
          FK_CHANNEL: dev

      # Production and the dev alias share one D1. Migrations are expand/contract
      # (backward-compatible for one release), so stable keeps working on them.
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply feedbackkit --remote

      - name: Upload dev version
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: pnpm exec wrangler versions upload --preview-alias dev --tag "$TAG" --message "dev ${TAG} (${GITHUB_SHA::7})"

      - name: Smoke check
        if: vars.FK_DEV_URL != ''
        env:
          DEV_URL: ${{ vars.FK_DEV_URL }}
          VERSION: ${{ steps.v.outputs.version }}
        run: node scripts/smoke-check.mjs "$DEV_URL" "$VERSION" dev

      - name: Prerelease
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: gh release create "$TAG" dist/widget.js --prerelease --target "$GITHUB_SHA" --title "$TAG" --generate-notes

      # The standalone server as a signed tarball. Without a signing key nothing is
      # published: an unsigned tarball is never attached to a release.
      - name: Build, sign and attach the server tarball
        if: env.FK_RELEASE_SIGNING_KEY != ''
        env:
          TAG: ${{ steps.v.outputs.tag }}
          FK_RELEASE: ${{ steps.v.outputs.version }}
        run: |
          pnpm build:server
          node scripts/build-bundle.mjs
          sh scripts/sign-release.sh dist-bundle/SHA256SUMS
          gh release upload "$TAG" dist-bundle/feedbackkit-v*.tar.gz dist-bundle/SHA256SUMS dist-bundle/SHA256SUMS.sig
      - name: No signing key
        if: env.FK_RELEASE_SIGNING_KEY == ''
        run: echo "::warning::FK_RELEASE_SIGNING_KEY is not set in the dev environment, so no server tarball was published (docs/RELEASES.md, Release keys)."

      - name: Keep the newest 3 dev builds
        run: |
          node scripts/release-version.mjs prune-dev 3 | while read -r old; do
            gh release delete "$old" --yes --cleanup-tag || git push origin --delete "refs/tags/$old" || true
          done
