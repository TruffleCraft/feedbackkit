name: CI
on:
  push:
    branches: [main]
  pull_request:

# Secret-free: fork PRs get green builds. No deploy, no live keys.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # the floor, S19
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:widget
      - run: git diff --exit-code -- site/src/widget-ver.ts
      - run: pnpm check:bundle
      - run: pnpm exec wrangler deploy --config site/wrangler.toml --dry-run
      - run: pnpm materialize && pnpm exec wrangler deploy --dry-run
        env:
          CLOUDFLARE_ACCOUNT_ID: 00000000000000000000000000000000
          FK_D1_ID: 00000000-0000-0000-0000-000000000000
          FK_R2_BUCKET: feedbackkit-ci
      # Same build with the optional MCP KV binding (ADR-015).
      - run: pnpm materialize && pnpm exec wrangler deploy --dry-run
        env:
          CLOUDFLARE_ACCOUNT_ID: 00000000000000000000000000000000
          FK_D1_ID: 00000000-0000-0000-0000-000000000000
          FK_R2_BUCKET: feedbackkit-ci
          FK_OAUTH_KV_ID: "0123456789abcdef0123456789abcdef" # quoted: YAML would read all zeros as the number 0

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e # builds the widget, then runs Playwright against mocked gateway (secret-free)

  standalone:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26] # the floor and the newest LTS line (S19)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:widget && pnpm build:server && pnpm test:server
      - run: pnpm build:bundle && ls -l dist-bundle && cat dist-bundle/SHA256SUMS

  secrets:
    # Runs for every pull request, a fork's included, and needs no secret: a fork's commits are
    # the ones most worth scanning before review. Rules and exceptions: .gitleaks.toml.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks, verified by SHA-256
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      # every commit's diff, with --remerge-diff showing what a merge changed beyond an automatic
      # merge; then the checked-out tree
      - name: Scan the history and the tree
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --log-opts="--remerge-diff" .
          "$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact --no-banner .
